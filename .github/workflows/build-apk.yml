name: Build Mobile Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile React Frontend Web App
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd frontend
          npm install
          npm run build

      - name: Sync Frontend Code to Capacitor Android Project
        run: |
          cd frontend
          npx cap sync android

      - name: Compile Production APK File via Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK File as Download Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk