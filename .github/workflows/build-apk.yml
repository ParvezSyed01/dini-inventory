name: Build Mobile Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile React Frontend Web App
        run: |
          cd frontend
          npm install
          npm run build

      - name: Sync Frontend Code to Capacitor Android Project
        run: |
          cd frontend
          npm install @capacitor/android
          npx cap add android || true
          npx cap sync android

      # 👇 THIS NEW STEP AUTOMATICALLY FIXES THE "FAILED TO FETCH" BLOCK ON THE CLOUD
      - name: Inject Android Network Security Rules
        run: |
          MANIFEST_PATH="frontend/android/app/src/main/AndroidManifest.xml"
          
          # 1. Inject the INTERNET and ACCESS_NETWORK_STATE permissions cleanly into the manifest template
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' $MANIFEST_PATH
          
          # 2. Inject cleartext traffic rules so Android allows Supabase API requests
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST_PATH

      - name: Compile Production APK File via Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK File as Download Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
